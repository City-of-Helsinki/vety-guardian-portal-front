# Included into the default server block of the ubi9/nginx-126 image
# (/opt/app-root/etc/nginx.default.d/). The server listens on 8080 and
# serves /opt/app-root/src.

index index.html;

# Kubernetes/OpenShift readiness probe
location = /readiness {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
}

# Vite emits content-hashed file names under /assets, so they can be cached forever
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Generated at container start; always revalidate
location = /env-config.js {
    add_header Cache-Control "no-cache";
}

# Always revalidate index.html so new deployments are picked up
location = /index.html {
    add_header Cache-Control "no-cache";
}

# SPA fallback: let the client-side router handle unknown paths
location / {
    try_files $uri $uri/ /index.html;
}
